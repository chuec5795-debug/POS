<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Roboto+Slab:wght@100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="card">

        <h1 class="title">Sign In</h1>

        <div class="emailform">   
            <label>Email: <span class="star">*</span></label>    
            <input type="email" placeholder="Enter Email" required>    
        </div>

        <div class="passwordform">

            <div class="label-container">
            <label>Password: <span class="star">*</span></label>
            <a href="#" class="forgotpassword">Forgot Password?</a>
            </div>

            <div class="password-group">
            <input type="password" placeholder="Enter Password" required>
            </div>

        </div>

        <div class="role">
            <button type="button" class="admin-btn">Admin</button>
            <button type="button" class="sales-btn">Sales</button>
            <button type="button" class="manager-btn">Manager</button>
        </div>

        <div class="login-btn">
        <button type="submit">Login</button>
        </div>

    </div>
</body>
</html>
