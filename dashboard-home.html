<!-- KPI Cards Container -->
<div class="dashboard-body" id="dashboardBody">
  <div class="kpi-container">
    <div class="kpi-card">
      <div class="kpi-icon blue"><i class="fa-solid fa-chart-line"></i></div>
      <div class="kpi-info">
        <h3>Total Sales</h3>
        <p id="totalSales">$0</p>
      </div>
    </div>

    <div class="kpi-card">
      <div class="kpi-icon green"><i class="fa-solid fa-wallet"></i></div>
      <div class="kpi-info">
        <h3>Total Profit</h3>
        <p id="totalProfit">$0</p>
      </div>
    </div>

    <div class="kpi-card">
      <div class="kpi-icon orange"><i class="fa-solid fa-users"></i></div>
      <div class="kpi-info">
        <h3>Total Customers</h3>
        <p id="totalCustomers">0</p>
      </div>
    </div>
  </div>
</div>
<div class="dashboard-overview">
  <h2 style="margin-bottom: 20px">Sales Analytics & Daily Transactions</h2>
  <div style="display: flex ; justify-content: space-around;">
    <div
      class="chart-container"
      style="position: relative; height: 280px; width: 40%"
    >
      <h3>Weekly Sales Overview</h3>
      <canvas id="weeklySalesChart"></canvas>
    </div>
    <div
      class="chart-container"
      style="position: relative; height: 280px; width: 40%"
    >
      <h3>Daily Sales Overview</h3>
      <canvas id="dailySalesChart"></canvas>
    </div>
  </div>
</div>
