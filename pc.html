<!DOCTYPE html>
<html>

<head>
    <title>POS Table Display</title>

    <script src="js/qrcode.min.js"></script>
    <link rel="stylesheet" href="css/pos.css">
</head>

<body>

    <h1>🛒 Cashier POS Terminal</h1>
    <p>Scan a barcode to add items to the cart table.</p>


    <table>
        <thead>
            <tr>
                <th>Item Name</th>
                <th>Price</th>
                <th style="text-align: center;">Qty</th>
                <th style="text-align: right;">Subtotal</th>
            </tr>
        </thead>
        <tbody id="Table">
            <tr>
                <td colspan="4" style="text-align: center;">No items scanned yet. Click here and scan a barcode.</td>
            </tr>
        </tbody>
    </table>

    <div class="total-box">
        <h2 style="margin: 0;">Grand Total: $<span id="grandTotalDisplay">0.00</span></h2>
    </div>

    <button onclick="clearCart()">New Customer (Clear Cart)</button>
    <button class="btn btn-checkout" onclick="givingReceipt()">Finish & Get Digital Receipt</button>

    <div id="receiptModal"
        style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); align-items:center; justify-content:center;">
        <div style="background:white; padding:30px; border-radius:10px; text-align:center; max-width:350px; width:90%;">
            <h2>🧾 Digital Receipt</h2>
            <p>Scan with your phone camera to view receipt!</p>


            <div id="qrcode" style="display:flex; justify-content:center; margin:20px 0;"></div>

            <button onclick="closeReceipt()"
                style="padding:10px 20px; background:#e74c3c; color:white; border:none; border-radius:5px; cursor:pointer;">Close</button>
        </div>
    </div>


    <script src="js/pc-pos.js"></script>
</body>

</html>
